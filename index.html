<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Countdown">
<meta name="theme-color" content="#1e3c72">
<title>Countdown</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(160deg, #1e3c72 0%, #2a5298 100%);
    min-height: 100vh;
    min-height: 100dvh;
    color: #fff;
    padding: calc(env(safe-area-inset-top) + 30px) 20px calc(env(safe-area-inset-bottom) + 20px);
    display: flex;
    flex-direction: column;
    user-select: none;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 300;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-align: center;
    opacity: 0.9;
    margin-bottom: 24px;
  }

  .input-section {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 32px;
  }

  input[type="datetime-local"] {
    width: 100%;
    padding: 16px;
    border: 1.5px solid rgba(255,255,255,0.25);
    border-radius: 14px;
    background: rgba(255,255,255,0.12);
    color: #fff;
    font-size: 1rem;
    font-family: inherit;
    outline: none;
    -webkit-appearance: none;
    text-align: center;
  }

  input[type="datetime-local"]::-webkit-calendar-picker-indicator {
    filter: invert(1);
  }

  button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: #ff6b6b;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.15s;
  }

  button:active { transform: scale(0.97); }

  .countdown {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  .time-block {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 18px;
    padding: 24px 8px;
    text-align: center;
  }

  .time-value {
    font-size: 2.8rem;
    font-weight: 700;
    display: block;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .time-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    opacity: 0.65;
    margin-top: 8px;
    display: block;
  }

  .message {
    text-align: center;
    font-size: 1.3rem;
    font-weight: 400;
    min-height: 1.8rem;
    color: #ffd93d;
  }

  .target-display {
    text-align: center;
    margin-top: 12px;
    font-size: 0.85rem;
    opacity: 0.6;
  }
</style>
</head>
<body>
  <h1>Countdown</h1>

  <div class="input-section">
    <input type="datetime-local" id="datetimeInput" />
    <button id="startBtn">Start</button>
  </div>

  <div class="countdown">
    <div class="time-block"><span class="time-value" id="days">00</span><span class="time-label">Days</span></div>
    <div class="time-block"><span class="time-value" id="hours">00</span><span class="time-label">Hours</span></div>
    <div class="time-block"><span class="time-value" id="minutes">00</span><span class="time-label">Minutes</span></div>
    <div class="time-block"><span class="time-value" id="seconds">00</span><span class="time-label">Seconds</span></div>
  </div>

  <div class="message" id="message"></div>
  <div class="target-display" id="targetDisplay"></div>

<script>
  const datetimeInput = document.getElementById('datetimeInput');
  const startBtn = document.getElementById('startBtn');
  const daysEl = document.getElementById('days');
  const hoursEl = document.getElementById('hours');
  const minutesEl = document.getElementById('minutes');
  const secondsEl = document.getElementById('seconds');
  const messageEl = document.getElementById('message');
  const targetDisplayEl = document.getElementById('targetDisplay');
  let intervalId = null;

  function setDefaultDate() {
    const d = new Date();
    d.setDate(d.getDate() + 1);
    d.setHours(0,0,0,0);
    const tz = d.getTimezoneOffset() * 60000;
    datetimeInput.value = new Date(d - tz).toISOString().slice(0,16);
  }

  const pad = n => String(n).padStart(2, '0');

  function tick() {
    const target = new Date(datetimeInput.value).getTime();
    const dist = target - Date.now();
    if (dist <= 0) {
      clearInterval(intervalId); intervalId = null;
      daysEl.textContent = hoursEl.textContent = minutesEl.textContent = secondsEl.textContent = '00';
      messageEl.textContent = "🎉 Time's up!";
      return;
    }
    daysEl.textContent = pad(Math.floor(dist / 86400000));
    hoursEl.textContent = pad(Math.floor(dist % 86400000 / 3600000));
    minutesEl.textContent = pad(Math.floor(dist % 3600000 / 60000));
    secondsEl.textContent = pad(Math.floor(dist % 60000 / 1000));
  }

  startBtn.addEventListener('click', () => {
    if (!datetimeInput.value) { messageEl.textContent = "Pick a date"; return; }
    if (new Date(datetimeInput.value).getTime() <= Date.now()) {
      messageEl.textContent = "Pick a future date"; return;
    }
    messageEl.textContent = "";
    targetDisplayEl.textContent = "→ " + new Date(datetimeInput.value).toLocaleString();
    if (intervalId) clearInterval(intervalId);
    tick();
    intervalId = setInterval(tick, 1000);
  });

  setDefaultDate();
</script>
</body>
</html>
